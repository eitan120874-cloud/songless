<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נחש את השיר</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1b18;--mut:#7a746b;--ac:#2a6fdb;--ok:#2e9e5b;--bad:#d64545;--bd:#ddd7cc}
@media (prefers-color-scheme:dark){:root{--bg:#17161a;--card:#222126;--tx:#f1eee8;--mut:#9a948a;--ac:#5b9bff;--ok:#4cc27f;--bad:#f06a6a;--bd:#38363d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:20px 16px 40px}
h1{font-size:26px;margin:0 0 4px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.bars{display:flex;gap:6px;margin-bottom:14px}
.bars div{flex:1;height:10px;border-radius:5px;background:var(--bd)}
.bars .used{background:var(--bad)}.bars .cur{background:var(--ac)}.bars .win{background:var(--ok)}
.play{display:block;margin:6px auto 4px;width:84px;height:84px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:34px;cursor:pointer}
.play:disabled{opacity:.4}
.len{text-align:center;color:var(--mut);font-size:14px;margin-bottom:8px;min-height:20px}
.guesses{list-style:none;padding:0;margin:0 0 12px}
.guesses li{padding:9px 12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;font-size:15px}
.guesses li.skip{color:var(--mut)}.guesses li.wrong{color:var(--bad)}
.inwrap{position:relative}
input[type=text]{width:100%;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.sug{position:absolute;inset-inline:0;top:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;max-height:220px;overflow:auto;z-index:5;display:none}
.sug div{padding:10px 12px;cursor:pointer;font-size:15px}.sug div:hover{background:var(--bg)}
.row{display:flex;gap:8px;margin-top:10px}
button.b{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.res{text-align:center;font-size:18px;margin:6px 0 10px;font-weight:600}
.small{font-size:12px;color:var(--mut);text-align:center}
.score{display:flex;justify-content:space-around;text-align:center;font-size:13px;color:var(--mut)}
.score b{display:block;font-size:20px;color:var(--tx)}
</style>
</head>
<body>
<main>
<h1>🎵 נחש את השיר</h1>
<p class="sub">שירים בעברית · מקשיבים לשיר האמיתי</p>
<div class="card score"><div><b id="sW">0</b>ניצחונות</div><div><b id="sP">0</b>משחקים</div><div><b id="sS">0</b>רצף</div></div>
<div class="card">
  <div class="bars" id="bars"></div>
  <button class="play" id="play" disabled>▶</button>
  <div class="len" id="len">טוען שיר...</div>
  <ul class="guesses" id="guesses"></ul>
  <div id="result"></div>
  <div id="inputArea">
    <div class="inwrap"><input type="text" id="q" placeholder="הקלד שם שיר או אמן..." autocomplete="off"><div class="sug" id="sug"></div></div>
    <div class="row"><button class="b" id="skip">דלג (+קטע)</button><button class="b p" id="send">שלח ניחוש</button></div>
    <div class="row"><button class="b" id="bad" style="font-size:13px">השיר לא נטען / לא נכון? טען אחר</button></div>
  </div>
  <div class="row" id="again" style="display:none"><button class="b p" id="next">שיר הבא</button></div>
</div>
<p class="small">הקטעים הם תצוגות מקדימות רשמיות של 30 שניות מ-Apple Music (iTunes).</p>
</main>
<audio id="aud" preload="auto"></audio>
<script>
const STAGES=[1,2,4,7,11,16];
// [שם שיר, אמן] — ערוך/הוסף שורות בחופשיות
const SONGS=[["הללויה","ירדנה ארזי"],["אהבתיה","שלמה ארצי"],["אבא","שלמה ארצי"],["שבלול","אריק איינשטיין"],["עוף גוזל","אריק איינשטיין"],["אני ואתה","אריק איינשטיין"],["ים של דמעות","ישי ריבו"],["חיים שלי","ברי סחרוף"],["הכל עובר חביבי","אביב גפן"],["לאן נעלם הזמן","מאיר אריאל"],["יש לי אותך","עומר אדם"],["תמונות מהחיים","עידן רייכל"],["אחרי כל השנים","בועז שרעבי"],["נוגה","הדג נחש"],["אין לי ארץ אחרת","אהוד בנאי"],["ירושלים של זהב","נעמי שמר"],["לו יהי","נעמי שמר"],["על כל אלה","נעמי שמר"],["שיר לשלום","מירי אלוני"],["פרח בגני","יהורם גאון"],["לילה לילה","שולי רנד"],["בלדה לשוטר","אריק איינשטיין"],["מה אברך","אביהו מדינה"],["עוד חוזר הניגון","יפה ירקוני"],["הרעות","הצ'יזבטרון"],["ציפור","אתניקס"],["זמן אמת","אתניקס"],["לבד בכיכר","ריטה"],["אני וסי ואחרים","אריק איינשטיין"],["מי שאוהב","עמיר בניון"],["דרכנו","אביב גפן"],["אהבה ראשונה","שרית חדד"],["שמש","עברי לידר"],["תפסתי כיוון","חנן בן ארי"],["זה הזמן","שלמה גרוניך"],["אוהב אותך","שלמה גרוניך"],["ימים של קסם","נינט טייב"],["רק בך","נועה קירל"],["בלדה לאישה","דני סנדרסון"],["נתתי לה חיי","שלמה ארצי"],["פתאום עכשיו","בן ארצי"],["תן לי יד","חנן יובל"],["הנה מה טוב","מסורתי"],["שיר המעלות","מסורתי"],["יום חדש","מאור כהן"],["לא יאומן","שלמה ארצי"],["מלכת הכביש","אביב גפן"],["מישהו","שלמה ארצי"],["חבר'ה","עמיר בניון"],["אושר","אביב גפן"]];
const $=id=>document.getElementById(id);
const norm=s=>s.replace(/[\u0591-\u05C7]/g,"").replace(/[-–_.,!?'"()׳״]/g," ").replace(/\s+/g," ").trim().toLowerCase();
const label=s=>s[0]+" - "+s[1];
let cur=null,url=null,stage=0,guesses=[],over=false,stopT=null,loadId=0,seen=new Set();
let S={w:0,p:0,s:0};try{S=Object.assign(S,JSON.parse(localStorage.getItem("sl_he2")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("sl_he2",JSON.stringify(S))}catch(e){}$("sW").textContent=S.w;$("sP").textContent=S.p;$("sS").textContent=S.s}
function esc(s){return s.replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

async function findPreview(song){
  const q=encodeURIComponent(song[0]+" "+song[1]);
  const r=await fetch(`https://itunes.apple.com/search?term=${q}&country=IL&media=music&entity=song&limit=10`);
  const j=await r.json();
  const t=norm(song[0]);
  const hit=j.results.find(x=>x.previewUrl&&norm(x.trackName).includes(t))||j.results.find(x=>x.previewUrl);
  return hit?hit.previewUrl:null;
}
async function newRound(){
  stop();over=false;stage=0;guesses=[];url=null;
  const id=++loadId;
  $("result").innerHTML="";$("inputArea").style.display="";$("again").style.display="none";$("q").value="";$("play").disabled=true;
  $("len").textContent="טוען שיר...";bars();render();
  for(let tries=0;tries<6;tries++){
    if(seen.size>=SONGS.length)seen.clear();
    let s;do{s=SONGS[Math.floor(Math.random()*SONGS.length)]}while(seen.has(s[0]));
    seen.add(s[0]);
    try{const u=await findPreview(s);if(id!==loadId)return;if(u){cur=s;url=u;$("aud").src=u;$("play").disabled=false;bars();return}}catch(e){}
  }
  $("len").textContent="לא הצלחתי לטעון שיר. בדוק חיבור לאינטרנט ונסה שוב.";
}
function stop(){clearTimeout(stopT);$("aud").pause();$("play").textContent="▶"}
function play(){
  if($("play").textContent==="■"){stop();return}
  const d=over?30:STAGES[stage],a=$("aud");
  a.currentTime=0;a.play().catch(()=>{});$("play").textContent="■";
  stopT=setTimeout(stop,d*1000);
}
function bars(win){
  $("bars").innerHTML=STAGES.map((_,i)=>`<div class="${win&&i===stage?"win":i<guesses.length?"used":i===stage&&!over?"cur":""}"></div>`).join("");
  if(url&&!over)$("len").textContent=`קטע של ${STAGES[stage]} שניות · ניסיון ${stage+1} מתוך ${STAGES.length}`;
  if(over)$("len").textContent="אפשר להאזין לקטע המלא (30 שניות)";
}
function render(){$("guesses").innerHTML=guesses.map(g=>`<li class="${g.skip?"skip":"wrong"}">${g.skip?"⏭ דילוג":"✗ "+esc(g.t)}</li>`).join("")}
function correct(t){const a=norm(t);return a===norm(cur[0])||a===norm(label(cur))}
function finish(win){
  over=true;S.p++;if(win){S.w++;S.s++}else S.s=0;save();stop();bars(win);
  $("result").innerHTML=`<div class="res" style="color:var(--${win?"ok":"bad"})">${win?"🎉 נכון!":"😔 לא הפעם"}<br><span style="color:var(--tx)">${esc(label(cur))}</span></div>`;
  $("inputArea").style.display="none";$("again").style.display="flex";
}
function wrong(t,skip){
  guesses.push({t,skip});
  if(guesses.length>=STAGES.length){render();finish(false);return}
  stage++;bars();render();$("q").value="";$("sug").style.display="none";
}
function submit(){if(over||!url)return;const t=$("q").value.trim();if(!t)return;if(correct(t)){guesses.push({t});render();finish(true)}else wrong(t,false)}
$("play").onclick=play;
$("skip").onclick=()=>{if(!over&&url)wrong("",true)};
$("send").onclick=submit;
$("next").onclick=newRound;
$("bad").onclick=newRound;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});
$("q").addEventListener("input",()=>{
  const v=norm($("q").value),box=$("sug");
  if(!v){box.style.display="none";return}
  const m=SONGS.filter(s=>norm(label(s)).includes(v)).slice(0,8);
  box.innerHTML=m.map(s=>`<div>${esc(label(s))}</div>`).join("");
  box.style.display=m.length?"block":"none";
  [...box.children].forEach(d=>d.onclick=()=>{$("q").value=d.textContent;box.style.display="none"});
});
save();newRound();
</script>
</body>
</html>
